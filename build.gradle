plugins {
	// Minecraft 1.21.1 est une version obfusquée : c'est le plugin « remap » qu'il faut.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	maven {
		// JEI : seulement son API à la compilation (le greffon des recettes d'alambic).
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
}

loom {
	splitEnvironmentSourceSets()
}

// Outil de test local (src/pilote) : un petit mod de développement à part,
// qui ne va pas dans le jar. Absent du dépôt public : tout ce bloc est alors sauté.
def avecPilote = file('src/pilote').isDirectory()

if (avecPilote) {
	sourceSets {
		pilote {
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
			compileClasspath += sourceSets.main.output + sourceSets.client.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
			runtimeClasspath += sourceSets.main.output + sourceSets.client.output
		}
	}
}

loom {
	mods {
		"jn1" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		if (avecPilote) {
			"jn1_pilote" {
				sourceSet sourceSets.pilote
			}
		}
	}

	// Un client à part (run_pilote/), qui ouvre directement le monde « pilote »
	// et écoute sur un port local.
	if (avecPilote) {
		runs {
			pilote {
				client()
				name = "Pilote"
				source sourceSets.pilote
				runDir = "run_pilote"
				vmArg "-Djn1.pilote=25599"
				programArgs "--username", "Pilote", "--width", "960", "--height", "540",
						"--quickPlaySingleplayer", "pilote"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	// JEI n'est pas exigé : le greffon (JeiCompat) n'est chargé que s'il est là.
	// 19.56 : la dernière construite avec un Loom que le nôtre lit (1.13 ; 19.57 et après : 1.18).
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:19.56.0.441"
}

processResources {
	def props = [
			version           : project.version,
			minecraft_version : project.minecraft_version,
			loader_min_version: project.loader_min_version
	]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}

	// Le dossier d'art (art/textures, local) : une texture retouchée à la main y
	// remplace, au même chemin, celle des ressources. Celle des ressources est
	// écartée avant la copie : jamais deux fichiers pour une même destination.
	def art = file('art/textures')
	if (art.isDirectory()) {
		inputs.dir(art)
		from(art) {
			into 'assets/jn1/textures'
			include '**/*.png', '**/*.mcmeta'
		}
		eachFile { details ->
			def chemin = details.relativePath.pathString
			def préfixe = 'assets/jn1/textures/'
			if (chemin.startsWith(préfixe) && !details.file.toPath().startsWith(art.toPath())
					&& new File(art, chemin.substring(préfixe.length())).exists()) {
				details.exclude()
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	toolchain {
		// Aucun JDK 21 requis sur la machine : foojay le télécharge au besoin.
		languageVersion = JavaLanguageVersion.of(21)
	}

	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_$projectName" }
	}
	// Les crédits des modèles et ressources d'autres auteurs, à la racine du jar.
	from('CREDITS.txt')
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

// Le nom du jar porte la version : chaque compilation après un changement de
// version écrit un nouveau fichier au lieu de remplacer l'ancien, et build/libs
// finissait par en contenir une pile où l'on ne savait plus lequel installer.
// Gradle ne fait pas ce ménage seul — seul « clean » l'aurait fait, en jetant
// tout le reste avec.
tasks.register('elaguerJars') {
	description = "Retire de build/libs et build/devlibs les jars d'anciennes versions."
	doLast {
		def courant = "${project.archives_base_name}-${project.version}"
		[file("$buildDir/libs"), file("$buildDir/devlibs")].each { dossier ->
			if (!dossier.isDirectory()) {
				return
			}
			// Seulement les noms que Loom produit (jn1-<version>.jar, -sources, -dev) :
			// une copie faite à la main (« jn1-0.82.0 copie.jar ») était emportée aussi.
			def produit = ~/^${java.util.regex.Pattern.quote(project.archives_base_name)}-\d+(\.\d+)*(-sources|-dev)?\.jar$/
			dossier.listFiles().findAll {
				it.name ==~ produit && !it.name.startsWith(courant)
			}.each {
				logger.lifecycle("  jar périmé retiré : ${it.name}")
				it.delete()
			}
		}
	}
}

tasks.named('build') {
	finalizedBy 'elaguerJars'
}
