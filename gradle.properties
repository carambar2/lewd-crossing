# Mémoire allouée à Gradle. La décompilation de Minecraft est gourmande.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA n'est pas encore pleinement compatible avec le configuration cache.
# Voir https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric — versions vérifiées sur https://fabricmc.net/develop et meta.fabricmc.net
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
loom_version=1.17.17

# Plancher réellement exigé au lancement. On compile avec le loader ci-dessus,
# mais le mod n'utilise rien qui lui soit propre : la vraie contrainte vient de
# GeckoLib, qui demande 0.17 dans toutes ses versions 1.21.1.
loader_min_version=0.17

# Mod
mod_version=0.90.3
maven_group=dev.pyrofetch
archives_base_name=jn1

# Dépendances
fabric_version=0.116.15+1.21.1
geckolib_version=4.9.2
