plugins {
	// Minecraft 1.21.1 is obfuscated: the remapping plugin is required.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	maven {
		// JEI: only its API at compile time (the brewing recipe plugin).
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
}

loom {
	splitEnvironmentSourceSets()
}

loom {
	mods {
		"jn1" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	// JEI is optional: the plugin (JeiCompat) only loads when JEI is present.
	// 19.56 is the last version built with a Loom this one can read.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:19.56.0.441"
}

processResources {
	def props = [
			version           : project.version,
			minecraft_version : project.minecraft_version,
			loader_min_version: project.loader_min_version
	]
	inputs.properties props

	// Assets and data shared by every version.
	inputs.dir('../../resources')
	from('../../resources')

	filesMatching('fabric.mod.json') {
		expand props
	}

}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	toolchain {
		// No local JDK 21 needed: foojay downloads one if required.
		languageVersion = JavaLanguageVersion.of(21)
	}

	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('../../LICENSE') {
		rename { "${it}_$projectName" }
	}
	// Credits for third-party models and assets, at the root of the jar.
	from('../../CREDITS.txt')
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

// The jar name carries the version: each build after a version change writes a
// new file instead of replacing the old one. This removes the jars of older
// versions from build/libs and build/devlibs (only the names Loom produces).
tasks.register('pruneOldJars') {
	description = 'Removes the jars of older versions from build/libs and build/devlibs.'
	doLast {
		def current = "${project.archives_base_name}-${project.version}"
		[file("$buildDir/libs"), file("$buildDir/devlibs")].each { folder ->
			if (!folder.isDirectory()) {
				return
			}
			def produced = ~/^${java.util.regex.Pattern.quote(project.archives_base_name)}-\d+(\.\d+)*(-sources|-dev)?\.jar$/
			folder.listFiles().findAll {
				it.name ==~ produced && !it.name.startsWith(current)
			}.each {
				logger.lifecycle("  removed old jar: ${it.name}")
				it.delete()
			}
		}
	}
}

tasks.named('build') {
	finalizedBy 'pruneOldJars'
}
