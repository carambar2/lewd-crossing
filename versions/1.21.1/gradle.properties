# Memory for Gradle: decompiling Minecraft is demanding.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric versions, see https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
loom_version=1.17.17

# Minimum loader version required at runtime (GeckoLib requires 0.17 for 1.21.1).
loader_min_version=0.17

# Mod
mod_version=0.90.4
maven_group=dev.pyrofetch
archives_base_name=jn1

# Dependencies
fabric_version=0.116.15+1.21.1
geckolib_version=4.9.2
