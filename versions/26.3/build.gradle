plugins {
	// 26.x is no longer obfuscated: no remapping, Mojang names everywhere.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		// JEI: only its API at compile time (the brewing recipe plugin).
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"jn1" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "maven.modrinth:geckolib:${project.geckolib_modrinth}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:31.23.0.130"
}

// Resources: the shared ones (../../resources), except the files this folder replaces
// (same path) or leaves out (excluded-resources.txt), then the hand-edited
// textures of art/ (a local folder, not in the repository).
def sharedResources = file('../../resources')
def art = file('../../art/textures')
def excluded = file('excluded-resources.txt').exists()
		? file('excluded-resources.txt').readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }
		: []

processResources {
	def props = [
			version           : project.version,
			minecraft_version : project.minecraft_version,
			loader_min_version: project.loader_min_version
	]
	inputs.properties props
	inputs.dir(sharedResources)
	if (art.isDirectory()) {
		inputs.dir(art)
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def local = file('src/main/resources')
	from(sharedResources) {
		exclude { element ->
			def path = element.relativePath.pathString
			// A folder present on both sides stays: only files are replaced.
			if (!element.isDirectory() && new File(local, path).isFile()) return true
			if (excluded.any { path == it || path.startsWith(it + '/') }) return true
			if (art.isDirectory() && !element.isDirectory() && path.startsWith('assets/jn1/textures/')
					&& new File(art, path.substring('assets/jn1/textures/'.length())).exists()) return true
			return false
		}
	}
	// GeckoLib 5 reads its models and animations under assets/<mod>/geckolib/.
	eachFile { details ->
		def path = details.relativePath.pathString
		if (path.startsWith('assets/jn1/geo/')) {
			details.path = 'assets/jn1/geckolib/models/' + path.substring('assets/jn1/geo/'.length())
		} else if (path.startsWith('assets/jn1/animations/')) {
			details.path = 'assets/jn1/geckolib/animations/' + path.substring('assets/jn1/animations/'.length())
		}
	}
	if (art.isDirectory()) {
		from(art) {
			into 'assets/jn1/textures'
			include '**/*.png', '**/*.mcmeta'
		}
	}
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from('../../LICENSE') {
		rename { "${it}_jn1" }
	}
	from('../../CREDITS.txt')
}

